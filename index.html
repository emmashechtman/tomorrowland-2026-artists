<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consciencia — Tomorrowland 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

  /* ── FUTURA STACK (system fallback that reads as Futura) ── */
  :root {
    --futura: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    --pink:   #FF9AD5;
    --blue:   #7DD3F5;
    --purple: #C97EFF;
    --grey:   #3A3A3A;
    --grey-bg:#1C1C1C;
    --off-white: #F5F5F5;
    --white: #FFFFFF;
    --tab-active: #FFFFFF;
    --tab-inactive: rgba(255,255,255,0.15);
    --font-size-base: 13px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: var(--futura); background: #111; color: var(--white); }

  /* ══════════════════════════════════════════
     PASSWORD / ENTRY SCREEN
  ══════════════════════════════════════════ */
  #entry-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: #000 url('Conciencia background.webp') center/cover no-repeat;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
  }
  #entry-screen > * { position: relative; z-index: 1; }
  #entry-logo {
    width: min(480px, 78vw);
    filter:
      drop-shadow(0 0 18px rgba(255,255,255,0.95))
      drop-shadow(0 0 50px rgba(201,126,255,0.75))
      drop-shadow(0 0 100px rgba(201,126,255,0.45))
      drop-shadow(0 0 160px rgba(150,80,255,0.25));
  }
  #entry-form {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    background: rgba(0,0,0,0.42);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 28px 44px 32px;
    border: 1px solid rgba(255,255,255,0.07);
  }
  #entry-form input {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 50px;
    color: #fff;
    font-family: var(--futura);
    font-size: 16px;
    letter-spacing: 4px;
    padding: 12px 28px;
    text-align: center;
    outline: none;
    width: 220px;
    transition: border-color .2s;
  }
  #entry-form input::placeholder { letter-spacing: 2px; color: rgba(255,255,255,0.75); opacity: 1; }
  #entry-form input:focus { border-color: var(--purple); }
  #entry-error {
    color: #ff7070; font-size: 12px; font-family: var(--futura);
    opacity: 0; transition: opacity .2s; height: 16px;
  }
  #entry-btn {
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 50px;
    color: #fff;
    cursor: pointer;
    font-family: var(--futura);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 10px 36px;
    text-transform: uppercase;
    transition: background .2s, border-color .2s;
  }
  #entry-btn:hover { background: rgba(255,255,255,0.25); border-color: var(--purple); }

  /* ══════════════════════════════════════════
     USER SELECT SCREEN
  ══════════════════════════════════════════ */
  #user-screen {
    position: fixed; inset: 0; z-index: 9998;
    background: #000 url('Conciencia background.webp') center/cover no-repeat;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 36px;
  }
  #user-screen > * { position: relative; z-index: 1; }
  #user-screen h2 {
    font-family: var(--futura); font-size: 20px; font-weight: 700;
    letter-spacing: 5px; text-transform: uppercase; opacity: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.8);
  }
  .user-select-row { display: flex; gap: 20px; }
  .user-oval-btn {
    padding: 12px 36px; border-radius: 50px;
    font-family: var(--futura); font-size: 16px; font-weight: 700;
    letter-spacing: 2px; cursor: pointer; border: 2px solid transparent;
    transition: all .2s; background: var(--grey);
    color: #fff; text-transform: uppercase;
  }
  .user-oval-btn[data-user="Emma"]:hover,
  .user-oval-btn[data-user="Emma"].active { background: var(--pink); color: #111; border-color: var(--pink); }
  .user-oval-btn[data-user="TJ"]:hover,
  .user-oval-btn[data-user="TJ"].active { background: var(--blue); color: #111; border-color: var(--blue); }
  #user-enter-btn {
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 50px; color: #fff; cursor: pointer;
    font-family: var(--futura); font-size: 13px; font-weight: 700;
    letter-spacing: 2px; padding: 10px 36px; text-transform: uppercase;
    opacity: 0; pointer-events: none;
    transition: opacity .3s, background .2s, border-color .2s;
  }
  #user-enter-btn.visible {
    opacity: 1; pointer-events: all;
    background: rgba(255,255,255,0.92);
    border-color: #fff;
    color: #111;
  }
  #user-enter-btn.visible:hover { background: #fff; border-color: var(--purple); }

  /* ══════════════════════════════════════════
     MAIN APP
  ══════════════════════════════════════════ */
  #app {
    display: none; flex-direction: column;
    height: 100vh; overflow: hidden;
    background: #000;
    position: relative;
  }
  #app::before {
    content: '';
    position: absolute; inset: 0;
    background: url('Conciencia background.webp') center/cover no-repeat;
    opacity: 0.17;
    z-index: 0;
    pointer-events: none;
  }

  /* TOP BAR */
  #topbar {
    background: rgba(18,18,18,0.93);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
    position: relative; z-index: 1;
  }
  #logo-small {
    height: 28px; opacity: .9;
    filter: brightness(1.1);
  }

  /* USER TOGGLE */
  #user-toggle {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--futura); font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
  }
  #user-toggle span { opacity: .5; }
  .utoggle-btn {
    padding: 5px 16px; border-radius: 50px;
    font-family: var(--futura); font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.15);
    background: transparent; color: rgba(255,255,255,0.35); text-transform: uppercase;
    transition: all .18s;
  }
  .utoggle-btn[data-user="Emma"].active { background: var(--pink); color: #111; border-color: var(--pink); }
  .utoggle-btn[data-user="TJ"].active { background: var(--blue); color: #111; border-color: var(--blue); }

  /* MAIN TABS */
  #main-tabs {
    display: flex; gap: 10px; padding: 14px 20px 0;
    background: rgba(18,18,18,0.90); flex-shrink: 0;
    position: relative; z-index: 1;
  }
  .main-tab {
    font-family: var(--futura); font-size: 17px; font-weight: 700;
    letter-spacing: 1px; cursor: pointer;
    background: transparent; border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50px; color: rgba(255,255,255,0.4);
    padding: 10px 32px; text-transform: uppercase;
    transition: all .18s;
  }
  .main-tab.active {
    background: var(--white); border-color: var(--white);
    color: #111;
  }
  .main-tab:hover:not(.active) {
    border-color: rgba(255,255,255,0.6); color: rgba(255,255,255,0.7);
  }

  /* SCROLLABLE CONTENT */
  #content {
    flex: 1; overflow-y: auto;
    background: transparent;
    position: relative; z-index: 1;
  }

  /* ── ARTISTS PAGE ── */
  #artists-page { display: none; }
  #timetable-page { display: none; }

  /* Day tabs */
  #day-tabs {
    display: flex; gap: 8px; padding: 14px 20px 10px;
    background: rgba(16,16,16,0.88); border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap; align-items: center; justify-content: space-between;
  }
  .day-tab-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .day-tab {
    font-family: var(--futura); font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px; cursor: pointer;
    background: transparent; border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 50px; color: rgba(255,255,255,0.4);
    padding: 6px 16px; text-transform: uppercase; transition: all .15s;
  }
  .day-tab.active {
    background: var(--white); border-color: var(--white); color: #111;
  }
  .day-tab:hover:not(.active) { color: rgba(255,255,255,.7); border-color: rgba(255,255,255,.4); }

  /* Sort controls */
  .sort-group {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--futura); font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(255,255,255,.35);
  }
  .sort-btn {
    font-family: var(--futura); font-size: 10px; font-weight: 700;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
    background: transparent; border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 50px; color: rgba(255,255,255,0.3);
    padding: 4px 12px; transition: all .15s;
  }
  .sort-btn.active { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.35); color: rgba(255,255,255,.8); }
  .sort-btn:hover:not(.active) { color: rgba(255,255,255,.55); border-color: rgba(255,255,255,.3); }

  /* Artists container */
  #artists-container { padding: 20px; }

  /* Group headers */
  .group-header {
    font-family: var(--futura); font-size: 10px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: rgba(255,255,255,0.3); margin: 24px 0 12px;
    padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .group-header:first-child { margin-top: 0; }

  /* Artist pill */
  .artist-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .artist-pill {
    display: inline-flex; flex-direction: column; align-items: flex-start;
    background: var(--grey);
    border-radius: 50px; padding: 8px 18px;
    cursor: pointer; transition: background .15s, transform .1s;
    user-select: none; border: 1.5px solid transparent;
    min-width: 0;
  }
  .artist-pill:active { transform: scale(0.96); }
  .pill-name {
    font-family: var(--futura); font-size: 13px; font-weight: 400;
    color: var(--white); white-space: nowrap; line-height: 1.2;
    letter-spacing: .3px;
  }
  .pill-genre {
    font-family: var(--futura); font-style: italic; font-size: 10px;
    color: rgba(255,255,255,0.55); white-space: nowrap; line-height: 1;
    margin-top: 1px;
  }

  /* Liked states */
  .artist-pill.liked-emma { background: var(--pink); }
  .artist-pill.liked-emma .pill-name { color: #111; font-weight: 700; }
  .artist-pill.liked-emma .pill-genre { color: rgba(0,0,0,0.5); }

  .artist-pill.liked-tj { background: var(--blue); }
  .artist-pill.liked-tj .pill-name { color: #111; font-weight: 700; }
  .artist-pill.liked-tj .pill-genre { color: rgba(0,0,0,0.5); }

  .artist-pill.liked-both { background: var(--purple); }
  .artist-pill.liked-both .pill-name { color: #fff; font-weight: 700; }
  .artist-pill.liked-both .pill-genre { color: rgba(255,255,255,0.65); }

  /* TIMETABLE */
  #timetable-page { display: none; padding: 0; }
  #tt-day-tabs {
    display: flex; gap: 8px; padding: 14px 20px 10px;
    position: sticky; top: 0; z-index: 20;
    background: rgba(16,16,16,0.92);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tt-day-tab {
    font-family: var(--futura); font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px; cursor: pointer; text-transform: uppercase;
    background: transparent; border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 50px; color: rgba(255,255,255,0.4);
    padding: 6px 18px; transition: all .15s;
  }
  .tt-day-tab.active { background: var(--white); border-color: var(--white); color: #111; }
  .tt-day-tab:hover:not(.active) { color: rgba(255,255,255,.7); border-color: rgba(255,255,255,.4); }

  #tt-scroll { overflow-x: auto; overflow-y: hidden; padding: 6px 0 28px; }
  #tt-grid { min-width: max-content; }

  .tt-axis { display: flex; height: 26px; }
  .tt-axis-spacer {
    flex: 0 0 120px; position: sticky; left: 0; z-index: 6;
    background: #0d0d0d;
  }
  .tt-axis-track { position: relative; height: 100%; }
  .tt-tick {
    position: absolute; top: 5px; transform: translateX(-50%);
    font-family: var(--futura); font-size: 10px; letter-spacing: .5px;
    color: rgba(255,255,255,0.4); white-space: nowrap;
  }

  .tt-row { display: flex; align-items: stretch; }
  .tt-stage-label {
    flex: 0 0 120px; position: sticky; left: 0; z-index: 6;
    background: #0d0d0d;
    display: flex; align-items: center;
    font-family: var(--futura); font-size: 9px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    padding: 0 10px; border-top: 1px solid rgba(255,255,255,0.06);
  }
  .tt-track {
    position: relative; min-height: 56px;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: repeating-linear-gradient(to right,
      rgba(255,255,255,0.045) 0 1px, transparent 1px 120px);
  }
  .tt-block {
    position: absolute; top: 5px; bottom: 5px;
    background: rgba(255,255,255,0.92);
    border-radius: 8px; padding: 4px 8px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
    cursor: pointer; border: 1.5px solid transparent;
    transition: box-shadow .15s, transform .1s;
  }
  .tt-block:active { transform: scale(0.97); }
  .tt-name {
    font-family: var(--futura); font-size: 11px; font-weight: 700;
    color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.15;
  }
  .tt-time {
    font-family: var(--futura); font-size: 9px; color: rgba(0,0,0,0.55);
    white-space: nowrap; margin-top: 2px;
  }
  .tt-block.tt-static { cursor: default; background: rgba(255,255,255,0.45); }
  .tt-block.tt-static .tt-name { color: rgba(0,0,0,0.7); font-weight: 600; }
  .tt-block.liked-emma { background: var(--pink); box-shadow: 0 0 16px rgba(255,154,213,0.75); border-color: #fff; }
  .tt-block.liked-tj   { background: var(--blue); box-shadow: 0 0 16px rgba(125,211,245,0.75); border-color: #fff; }
  .tt-block.liked-both { background: var(--purple); box-shadow: 0 0 16px rgba(201,126,255,0.8); border-color: #fff; }
  .tt-block.liked-both .tt-name { color: #fff; }
  .tt-block.liked-both .tt-time { color: rgba(255,255,255,0.7); }

  /* LIKED PAGE */
  #liked-page { display: none; padding: 20px; }
  .liked-columns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .liked-col-header {
    font-family: var(--futura); font-size: 11px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    padding-bottom: 10px; margin-bottom: 12px;
    border-bottom: 2px solid;
  }
  .liked-col-header.col-emma { color: var(--pink); border-color: var(--pink); }
  .liked-col-header.col-both { color: var(--purple); border-color: var(--purple); }
  .liked-col-header.col-tj   { color: var(--blue);  border-color: var(--blue);  }
  .liked-col { display: flex; flex-direction: column; gap: 8px; }
  .liked-empty {
    font-family: var(--futura); font-style: italic; font-size: 11px;
    color: rgba(255,255,255,0.2); letter-spacing: 1px;
  }
  @media (max-width: 600px) {
    .liked-columns { grid-template-columns: 1fr; gap: 24px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

  /* Entry screen hidden */
  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .main-tab { font-size: 14px; padding: 8px 22px; }
    #artists-container { padding: 14px; }
    .artist-pill { padding: 7px 14px; }
    .pill-name { font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ══ ENTRY SCREEN ══ -->
<div id="entry-screen">
  <img id="entry-logo" src="Conciencia logo.png" alt="Consciencia" onerror="this.style.cssText='font-family:var(--futura);font-size:clamp(32px,8vw,64px);font-weight:700;letter-spacing:4px;color:#fff;display:block'">
  <div id="entry-form">
    <input type="password" id="pw-input" placeholder="enter password" autocomplete="off" />
    <div id="entry-error">Incorrect password. Try again.</div>
    <button id="entry-btn">Enter</button>
  </div>
</div>

<!-- ══ USER SELECT SCREEN ══ -->
<div id="user-screen">
  <img style="width:min(320px,60vw); filter:drop-shadow(0 0 30px rgba(201,126,255,.4));"
       src="Conciencia logo.png" alt="Consciencia"
       onerror="this.style.display='none'">
  <h2>Who are you?</h2>
  <div class="user-select-row">
    <button class="user-oval-btn" data-user="Emma">Emma</button>
    <button class="user-oval-btn" data-user="TJ">TJ</button>
  </div>
  <button id="user-enter-btn">Let's Go →</button>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app">

  <!-- Top bar -->
  <div id="topbar">
    <img id="logo-small" src="Conciencia logo.png" alt="Consciencia"
         onerror="this.outerHTML='<span style=\'font-family:var(--futura);font-size:14px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.8)\'>CONSCIENCIA</span>'">
    <div id="user-toggle">
      <span>User:</span>
      <button class="utoggle-btn" data-user="Emma">Emma</button>
      <button class="utoggle-btn" data-user="TJ">TJ</button>
    </div>
  </div>

  <!-- Main tabs -->
  <div id="main-tabs">
    <button class="main-tab active" data-tab="artists">Artists</button>
    <button class="main-tab" data-tab="liked">Liked</button>
    <button class="main-tab" data-tab="timetable">Timetable</button>
  </div>

  <!-- Content -->
  <div id="content">

    <!-- Artists page -->
    <div id="artists-page">
      <div id="day-tabs">
        <div class="day-tab-group">
          <button class="day-tab active" data-day="all">All</button>
          <button class="day-tab" data-day="fri">Fri, July 24</button>
          <button class="day-tab" data-day="sat">Sat, July 25</button>
          <button class="day-tab" data-day="sun">Sun, July 26</button>
        </div>
        <div class="sort-group">
          Sort:
          <button class="sort-btn active" data-sort="stage">Stage</button>
          <button class="sort-btn" data-sort="genre">Genre</button>
        </div>
      </div>
      <div id="artists-container"></div>
    </div>

    <!-- Liked page -->
    <div id="liked-page">
      <div class="liked-columns">
        <div class="liked-col">
          <div class="liked-col-header col-emma">Emma</div>
          <div id="liked-emma-pills"></div>
        </div>
        <div class="liked-col">
          <div class="liked-col-header col-both">Both</div>
          <div id="liked-both-pills"></div>
        </div>
        <div class="liked-col">
          <div class="liked-col-header col-tj">TJ</div>
          <div id="liked-tj-pills"></div>
        </div>
      </div>
    </div>

    <!-- Timetable page -->
    <div id="timetable-page">
      <div id="tt-day-tabs">
        <button class="tt-day-tab active" data-day="fri">Fri 24 Jul</button>
        <button class="tt-day-tab" data-day="sat">Sat 25 Jul</button>
        <button class="tt-day-tab" data-day="sun">Sun 26 Jul</button>
      </div>
      <div id="tt-scroll">
        <div id="tt-grid"></div>
      </div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA — Weekend 2 artists by day, stage, with genre
// Days mapped to W2 dates: Fri=July 25, Sat=July 26, Sun=July 27
// (W1 is July 18-20, W2 is July 25-27 — adjusted from prompt's June dates)
// ═══════════════════════════════════════════════════════════════

const ARTISTS = [

  // ── FRIDAY ─────────────────────────────────────────────────
  // MAINSTAGE
  { name: "Alok",               day: "fri", stage: "Mainstage",             genre: "Brazilian Bass" },
  { name: "Ely Oaks",           day: "fri", stage: "Mainstage",             genre: "Progressive House" },
  { name: "Hardwell",           day: "fri", stage: "Mainstage",             genre: "Big Room" },
  { name: "Indira Paganotto",   day: "fri", stage: "Mainstage",             genre: "Techno" },
  { name: "Kölsch",             day: "fri", stage: "Mainstage",             genre: "Melodic Techno" },
  { name: "MC Stretch",         day: "fri", stage: "Mainstage",             genre: "MC / Jungle" },

function ttToMin(t) {
  const [h, m] = t.split(':').map(Number);

}

const CORRECT_PW = 'bb';

document.getElementById('entry-btn').addEventListener('click', tryEnter);
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });

function fadeOut(el, duration, cb) {
  el.style.transition = `opacity ${duration}ms ease`;
  el.style.opacity = '0';
  setTimeout(cb, duration);
}

function fadeIn(el, duration) {
  el.style.opacity = '0';
  el.offsetHeight; // force reflow
  el.style.transition = `opacity ${duration}ms ease`;
  el.style.opacity = '1';
}

function tryEnter() {
  const v = document.getElementById('pw-input').value.trim().toLowerCase();
  if (v === CORRECT_PW) {
    const entryEl = document.getElementById('entry-screen');
    fadeOut(entryEl, 500, () => {
      entryEl.classList.add('hidden');
      const us = document.getElementById('user-screen');
      us.style.display = 'flex';
      fadeIn(us, 500);
    });
  } else {
    document.getElementById('entry-error').style.opacity = '1';
    document.getElementById('pw-input').value = '';
    setTimeout(() => document.getElementById('entry-error').style.opacity = '0', 2000);
  }
}

    document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.activeDay = tab.dataset.day;
    renderArtists();
  });
});

// SORT BUTTONS
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.sortMode = btn.dataset.sort;
    renderArtists();
  });
});

// ═══════════════════════════════════════════════════════════════
// LIKE LOGIC
// ═══════════════════════════════════════════════════════════════
function toggleLike(artist) {
  const k = artistKey(artist);
  if (!state.likes[k]) state.likes[k] = { emma: false, tj: false };
  if (state.currentUser === 'Emma') {
    state.likes[k].emma = !state.likes[k].emma;
  } else {
    state.likes[k].tj = !state.likes[k].tj;
  }
  saveLikes();
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
const STAGE_ORDER = [
  "Mainstage", "Freedom by Bud", "The Great Library", "Crystal Garden",
  "Atmosphere", "Core", "Planaxis", "Celestia by KuCoin", "Melodia by Corona",
  "The Rave Cave", "The Rose Garden", "Elixir", "Cage",
  "House of Fortune", "Moose Bar"
];

function renderArtists() {
  const container = document.getElementById('artists-container');
  container.innerHTML = '';

  const filtered = ARTISTS.filter(a => {
    if (state.activeDay === 'all') return true;
    return a.day === state.activeDay;
  });

  if (state.sortMode === 'stage') {
    renderByStage(container, filtered);
  } else {
    renderByGenre(container, filtered);
  }
}

function renderByStage(container, artists) {
  // Group
  const groups = {};
  artists.forEach(a => {
    if (!groups[a.stage]) groups[a.stage] = [];
    groups[a.stage].push(a);
  });

  STAGE_ORDER.forEach(stage => {
    const list = groups[stage];
    if (!list || list.length === 0) return;

    // day label if "all"
    const header = document.createElement('div');
    header.className = 'group-header';
    header.textContent = stage.toUpperCase();
    container.appendChild(header);

    const pillsRow = document.createElement('div');
    pillsRow.className = 'artist-pills';

    list.forEach(artist => {
      pillsRow.appendChild(makePill(artist, true)); // show genre in stage view
    });
    container.appendChild(pillsRow);
  });
}

function renderByGenre(container, artists) {
  const groups = {};
  artists.forEach(a => {
    if (!groups[a.genre]) groups[a.genre] = [];
    groups[a.genre].push(a);
  });

  const sorted = Object.keys(groups).sort();
  sorted.forEach(genre => {
    const header = document.createElement('div');
    header.className = 'group-header';
    header.textContent = genre.toUpperCase();
    container.appendChild(header);

    const pillsRow = document.createElement('div');
    pillsRow.className = 'artist-pills';
    groups[genre].forEach(artist => {
      pillsRow.appendChild(makePill(artist, false)); // no genre text in genre view
    });
    container.appendChild(pillsRow);
  });
}

function renderLiked() {
  const buckets = { emma: [], both: [], tj: [] };
  ARTISTS.forEach(a => {
    const s = getLikeState(a);
    if (s !== 'none') buckets[s].push(a);
  });

  ['emma', 'both', 'tj'].forEach(bucket => {
    const container = document.getElementById(`liked-${bucket}-pills`);
    container.innerHTML = '';
    if (buckets[bucket].length === 0) {
      container.innerHTML = '<div class="liked-empty">none yet</div>';
      return;
    }
    buckets[bucket].forEach(artist => {
      const pill = makePill(artist, true);
      container.appendChild(pill);
    });
  });
}

function renderTimetable() {
  const grid = document.getElementById('tt-grid');
  grid.innerHTML = '';
  const totalW = (TT_DAY_END - TT_DAY_START) * TT_PX;

  // Time axis
  const axis = document.createElement('div');
  axis.className = 'tt-axis';
  const spacer = document.createElement('div');
  spacer.className = 'tt-axis-spacer';
  axis.appendChild(spacer);
  const axisTrack = document.createElement('div');
  axisTrack.className = 'tt-axis-track';
  axisTrack.style.width = totalW + 'px';
  for (let m = TT_DAY_START; m <= TT_DAY_END; m += 60) {
    const tick = document.createElement('div');
    tick.className = 'tt-tick';
    const hh = (Math.floor(m / 60)) % 24;
    tick.textContent = String(hh).padStart(2, '0') + ':00';
    tick.style.left = ((m - TT_DAY_START) * TT_PX) + 'px';
    axisTrack.appendChild(tick);
  }
  axis.appendChild(axisTrack);
  grid.appendChild(axis);

  // Stage rows
  TT_STAGE_ORDER.forEach(stage => {
    const items = SCHEDULE.filter(x => x.day === ttDay && x.stage === stage);
    if (items.length === 0) return;

    const row = document.createElement('div');
    row.className = 'tt-row';

    const label = document.createElement('div');
    label.className = 'tt-stage-label';
    label.textContent = stage.toUpperCase();
    row.appendChild(label);

    const track = document.createElement('div');
    track.className = 'tt-track';
    track.style.width = totalW + 'px';

    items.forEach(it => {
      const s = ttToMin(it.start);
      const e = ttToMin(it.end);
      const block = document.createElement('div');
      block.className = 'tt-block';
      block.style.left = ((s - TT_DAY_START) * TT_PX) + 'px';
      block.style.width = Math.max((e - s) * TT_PX - 3, 28) + 'px';

      if (it.extra) {
        block.classList.add('tt-static');
      } else {
        const pseudo = { name: it.name, day: it.day };
        const ls = getLikeState(pseudo);
        if (ls === 'emma') block.classList.add('liked-emma');
        else if (ls === 'tj') block.classList.add('liked-tj');
        else if (ls === 'both') block.classList.add('liked-both');
        block.addEventListener('click', () => {
          toggleLike(pseudo);
          renderTimetable();
        });
      }

      const nm = document.createElement('div');
      nm.className = 'tt-name';
      nm.textContent = it.name;
      const tm = document.createElement('div');
      tm.className = 'tt-time';
      tm.textContent = it.start + ' – ' + it.end;
      block.appendChild(nm);
      block.appendChild(tm);
      track.appendChild(block);
    });

    row.appendChild(track);
    grid.appendChild(row);
  });
}

document.querySelectorAll('.tt-day-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tt-day-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    ttDay = tab.dataset.day;
    renderTimetable();
  });
});

function makePill(artist, showGenre) {
  const pill = document.createElement('div');
  pill.className = 'artist-pill';

  const likeState = getLikeState(artist);
  if (likeState === 'emma') pill.classList.add('liked-emma');
  else if (likeState === 'tj') pill.classList.add('liked-tj');
  else if (likeState === 'both') pill.classList.add('liked-both');

  const nameEl = document.createElement('span');
  nameEl.className = 'pill-name';
  nameEl.textContent = artist.name;
  pill.appendChild(nameEl);

  if (showGenre) {
    const genreEl = document.createElement('span');
    genreEl.className = 'pill-genre';
    genreEl.textContent = artist.genre;
    pill.appendChild(genreEl);
  }

  pill.addEventListener('click', () => {
    toggleLike(artist);
    const activeTab = document.querySelector('.main-tab.active')?.dataset.tab;
    if (activeTab === 'liked') renderLiked();
    else renderArtists();
  });

  return pill;
}
